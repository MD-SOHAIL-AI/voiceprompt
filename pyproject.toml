[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voiceprompt-desktop"
version = "0.5.0"
description = "Local Windows voice typing and daily focus tools"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "MIT"
dynamic = ["dependencies"]

[project.scripts]
voiceprompt = "voiceprompt.launcher:main"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
include = ["voiceprompt*"]

[tool.setuptools.package-data]
voiceprompt = ["assets/*", "release.json"]
