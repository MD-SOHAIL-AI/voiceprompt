name: Main branch recording regression

on:
  pull_request:
    paths:
      - 'voiceprompt/recorder.py'
      - 'tests/test_recorder.py'
      - '.github/workflows/recording.yml'
  push:
    branches: [main]
    paths:
      - 'voiceprompt/recorder.py'
      - 'tests/test_recorder.py'
      - '.github/workflows/recording.yml'

permissions:
  contents: read

jobs:
  recording-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install test dependencies
        run: python -m pip install numpy sounddevice
      - name: Verify microphone tail handling
        run: python -m unittest discover -s tests -p test_recorder.py -v
