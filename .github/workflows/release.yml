name: Publish stable Windows update
on:
  push:
    tags: ['v[0-9]*.[0-9]*.[0-9]*', '!v*-*']
permissions:
  contents: read
concurrency:
  group: voiceprompt-stable-release
  cancel-in-progress: false
jobs:
  release:
    if: github.repository == 'MD-SOHAIL-AI/voiceprompt'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
      - name: Validate stable tag and main ancestry
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Select-String -Path pyproject.toml -Pattern '^version = "([^"]+)"').Matches[0].Groups[1].Value
          if ($env:GITHUB_REF_NAME -cne "v$version" -or $version -notmatch '^\d+\.\d+\.\d+$') { throw 'Tag must exactly match the stable application version.' }
          git merge-base --is-ancestor HEAD origin/main
          if ($LASTEXITCODE -ne 0) { throw 'Release tag must point to a commit on main.' }
          gh release view $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY --json isDraft
          if ($LASTEXITCODE -eq 0) { throw 'Release already exists. Use a new version; never replace release assets.' }
          exit 0
      - name: Install pinned dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Required source and browser checks
        uses: ./.github/actions/release-checks
      - name: Rust trust and handoff regressions
        shell: pwsh
        run: |
          cargo test --manifest-path desktop/src-tauri/Cargo.toml --locked --lib
          if ($LASTEXITCODE -ne 0) { throw 'Rust regressions failed.' }
          cargo clippy --manifest-path desktop/src-tauri/Cargo.toml --locked -- -D warnings
          if ($LASTEXITCODE -ne 0) { throw 'Rust review failed.' }
          ./scripts/audit_rust.ps1
      - name: Build and sign the complete update
        shell: pwsh
        env:
          VOICEPROMPT_UPDATE_PRIVATE_KEY: ${{ secrets.VOICEPROMPT_UPDATE_PRIVATE_KEY }}
          VOICEPROMPT_UPDATE_KEY_PASSWORD: ${{ secrets.VOICEPROMPT_UPDATE_KEY_PASSWORD }}
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          python scripts/build_update_release.py --notes "docs/release-notes-$version.md"
          if ($LASTEXITCODE -ne 0) { throw 'Update release build failed.' }
      - uses: ./.github/actions/previous-stable
      - name: Verify packaged engine, native UI, and installer
        shell: pwsh
        run: |
          python scripts/check_engine_bridge.py --engine dist/VoicePrompt/engine/VoicePromptEngine.exe
          if ($LASTEXITCODE -ne 0) { throw 'Packaged engine verification failed.' }
          ./scripts/check_native.ps1 -Python python
          ./scripts/check_installer.ps1 -Installer "release/VoicePrompt-Setup-$($env:GITHUB_REF_NAME.Substring(1))-x64.exe" -AllowUnsignedPreview -BaselineInstaller build/previous-stable/VoicePrompt-Setup-0.6.3-x64.exe
          python scripts/release_updates.py verify --metadata release/latest.json --installer "release/VoicePrompt-Setup-$($env:GITHUB_REF_NAME.Substring(1))-x64.exe" --native-exe dist/VoicePrompt/VoicePrompt.exe
          if ($LASTEXITCODE -ne 0) { throw 'Final update verification failed.' }
      - uses: actions/upload-artifact@v4
        with:
          name: verified-stable-package
          retention-days: 90
          if-no-files-found: error
          path: |
            release/VoicePrompt-Setup-*-x64.exe*
            release/latest.json
            dist/VoicePrompt/VoicePrompt.exe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stable-acceptance-evidence
          retention-days: 90
          path: |
            build/*audit.json
            build/*checks.json
            build/*bridge.json
            build/clipboard-handoff.json
            build/installer-check.json
            build/frozen-smoke.json
            build/frozen-source-check.json
            build/model-library-review/
            .impeccable/review/*.png
  publish:
    needs: release
    runs-on: windows-latest
    environment: production
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: verified-stable-package
          path: verified
      - name: Upload draft and verify hosted bytes before publication
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          $installer = "verified/release/VoicePrompt-Setup-$version-x64.exe"
          $metadata = 'verified/release/latest.json'
          $native = 'verified/dist/VoicePrompt/VoicePrompt.exe'
          python scripts/release_updates.py verify --metadata $metadata --installer $installer --native-exe $native
          if ($LASTEXITCODE -ne 0) { throw 'Transferred artifact signature verification failed.' }
          gh release create $env:GITHUB_REF_NAME $installer "$installer.sha256" "$installer.signing.json" "$installer.update-signing.json" $metadata --repo $env:GITHUB_REPOSITORY --draft --verify-tag --title "VoicePrompt $version" --notes-file "docs/release-notes-$version.md"
          if ($LASTEXITCODE -ne 0) { throw 'Draft upload failed. Nothing was published.' }
          python scripts/verify_release_assets.py --tag $env:GITHUB_REF_NAME --installer $installer --metadata $metadata --native-exe $native
          if ($LASTEXITCODE -ne 0) { throw 'Hosted verification failed; the release remains a draft.' }
          gh release edit $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed; inspect the draft.' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hosted-stable-verification
          retention-days: 90
          path: verified/release/*.hosted-verification.json
