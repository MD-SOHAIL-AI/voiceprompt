name: Windows app

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install locked dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Verify Python syntax and resolved dependencies
        run: |
          python -m pip check
          python -m compileall -q voiceprompt tests
      - name: Run regression checks
        env:
          VOICEPROMPT_TEST_LEGACY_TK: '0'
        run: python -m unittest discover -s tests -v
      - name: Build app, check workers, and compile installer
        shell: pwsh
        run: ./scripts/build_windows.ps1 -Python python -InnoCompiler 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
      - name: Verify installer, live uninstall, startup cleanup, and saved data
        shell: pwsh
        run: ./scripts/check_installer.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: VoicePrompt-windows-x64
          path: |
            release/*
            build/frozen-smoke.json
            build/installer-check.json
            build/uninstall-*.log
      - name: Publish tested unsigned Windows preview from main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = 'v0.4.1-preview.2'
          $installer = 'release/VoicePrompt-Setup-0.4.1-x64.exe'
          $checksum = "$installer.sha256"
          if (-not (Test-Path -LiteralPath $installer) -or -not (Test-Path -LiteralPath $checksum)) {
            throw 'Missing validated preview installer or SHA-256.'
          }
          $actual = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          if (-not (Get-Content -LiteralPath $checksum -Raw).Trim().StartsWith($actual + '  ')) {
            throw 'Preview installer checksum mismatch.'
          }
          $published = gh release view $tag --json isDraft --jq '.isDraft' 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Output "Release $tag already exists; no automatic asset overwrite."
            exit 0
          }
          gh release create $tag $installer $checksum --target $env:GITHUB_SHA --prerelease --title 'VoicePrompt 0.4.1 unsigned preview 2' --notes-file docs/release-notes-0.4.1.md
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish the validated preview release.' }
      - name: Prepare draft release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $installer = 'release/VoicePrompt-Setup-0.4.1-x64.exe'
          $checksum = "$installer.sha256"
          if (-not (Test-Path -LiteralPath $installer) -or -not (Test-Path -LiteralPath $checksum)) {
            throw 'Both the validated installer and its SHA-256 file are required for a release.'
          }
          $tag = $env:GITHUB_REF_NAME
          $versionMatch = Select-String -LiteralPath 'pyproject.toml' -Pattern '^version = "([^"]+)"'
          if (-not $versionMatch) { throw 'Cannot identify package version.' }
          $version = $versionMatch.Matches[0].Groups[1].Value
          if ($tag -notmatch ('^v' + [regex]::Escape($version) + '(-preview\.[0-9]+)?$')) {
            throw "Release tag $tag does not match package version $version."
          }
          $checksumLine = (Get-Content -LiteralPath $checksum -Raw).Trim()
          $actualHash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          if (-not $checksumLine.StartsWith($actualHash + '  ')) {
            throw 'Release checksum file does not match the installer.'
          }
          if ($tag -notmatch '-preview\.[0-9]+$') {
            throw 'Stable releases require real Windows acceptance and publisher signing; they cannot be published by this preview job.'
          }
          $release = gh release view $tag --json isDraft --jq '.isDraft' 2>$null
          if ($LASTEXITCODE -eq 0) {
            if ($release.Trim() -ne 'true') {
              Write-Output 'Existing release is published; refusing to overwrite its assets.'
              exit 0
            }
            gh release upload $tag $installer $checksum --clobber
            if ($LASTEXITCODE -ne 0) { throw 'Could not repair draft release assets.' }
          }
          else {
            gh release create $tag $installer $checksum --draft --prerelease --title "VoicePrompt $tag preview" --notes-file docs/release-notes-0.4.1.md
            if ($LASTEXITCODE -ne 0) { throw 'Could not create draft release.' }
          }
    permissions:
      contents: write
