name: Publish reviewed model catalog
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: voiceprompt-model-catalog
  cancel-in-progress: false
jobs:
  catalog:
    runs-on: windows-latest
    environment: model-catalog
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
      - run: pip install -r requirements-lock.txt
      - run: npm ci
        working-directory: desktop
      - name: Validate inventory and delivery regressions
        run: |
          python -m unittest discover -s tests -p test_model_library.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p test_delivery_reliability.py
      - name: Sign reviewed catalog
        env:
          VOICEPROMPT_UPDATE_PRIVATE_KEY: ${{ secrets.VOICEPROMPT_UPDATE_PRIVATE_KEY }}
          VOICEPROMPT_UPDATE_KEY_PASSWORD: ${{ secrets.VOICEPROMPT_UPDATE_KEY_PASSWORD }}
        run: python scripts/sign_model_catalog.py
      - name: Build the application's native signature verifier
        working-directory: desktop
        run: npm run tauri -- build --no-bundle --ci
      - name: Verify and publish catalog independently of app updates
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/publish_model_catalog.py --native-exe desktop/src-tauri/target/release/VoicePrompt.exe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-publication-evidence
          retention-days: 90
          path: build/catalog-publication.json
