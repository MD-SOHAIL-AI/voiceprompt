name: Windows app

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  regressions:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install tested Python dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Required source and browser checks
        uses: ./.github/actions/release-checks
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: VoicePrompt-ui-checks
          retention-days: 90
          path: |
            .impeccable/review/*.png
            build/ui-checks.json
            build/python-audit.json
            build/clipboard-handoff.json
            build/model-library-review/
            build/source-bridge.json
  native-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
          cache-on-failure: true
      - name: Install tested Python dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Build Tauri, frozen engine and unsigned test installer
        shell: pwsh
        run: ./scripts/build_desktop.ps1 -Python python -InnoCompiler 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' -AllowUnsignedPreview
      - name: Rust checks
        run: |
          cargo test --manifest-path desktop/src-tauri/Cargo.toml --locked --lib
          if ($LASTEXITCODE -ne 0) { throw 'Rust regressions failed.' }
          cargo clippy --manifest-path desktop/src-tauri/Cargo.toml --locked -- -D warnings
      - name: Audit pinned Rust dependencies
        shell: pwsh
        run: ./scripts/audit_rust.ps1
      - name: Verify frozen engine persistence and protocol
        run: python scripts/check_engine_bridge.py --engine dist/VoicePrompt/engine/VoicePromptEngine.exe
      - name: Verify actual native bridge and floating controls
        shell: pwsh
        run: ./scripts/check_native.ps1 -Python python
      - uses: ./.github/actions/previous-stable
      - name: Verify installation, upgrade, binary rollback and live uninstall
        shell: pwsh
        run: ./scripts/check_installer.ps1 -AllowUnsignedPreview -BaselineInstaller build/previous-stable/VoicePrompt-Setup-0.6.3-x64.exe
      - name: Stage verified beta installer
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[publish-beta]')
        uses: actions/upload-artifact@v4
        with:
          name: VoicePrompt-beta-release
          retention-days: 90
          if-no-files-found: error
          path: |
            release/VoicePrompt-Setup-*-x64-unsigned-preview.exe
            release/VoicePrompt-Setup-*-x64-unsigned-preview.exe.sha256
            release/VoicePrompt-Setup-*-x64-unsigned-preview.exe.signing.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: VoicePrompt-windows-x64-unsigned-preview
          retention-days: 90
          path: |
            build/frozen-smoke.json
            build/frozen-bridge.json
            build/installer-check.json
            build/native-checks.json
            build/rust-audit.json
            build/native-*.log
            build/uninstall-*.log
            .impeccable/review/native-*.png
  publish-beta:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[publish-beta]')
    needs: [regressions, native-package]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: VoicePrompt-beta-release
          path: release
      - name: Publish verified Windows beta
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Select-String -Path pyproject.toml -Pattern '^version = "([^"]+)"').Matches[0].Groups[1].Value
          if ($version -notmatch '^\d+\.\d+\.\d+(?:-(?:rc|beta|preview)\.[1-9]\d*)?$') { throw 'Invalid preview version.' }
          $tag = if ($version.Contains('-')) { "v$version" } else { "v$version-beta.1" }
          $notes = if ($version.Contains('-')) { "docs/release-notes-$version.md" } else { "docs/release-notes-$version-beta.1.md" }
          $installer = "release/VoicePrompt-Setup-$version-x64-unsigned-preview.exe"
          if (-not (Test-Path -LiteralPath $notes) -or -not (Test-Path -LiteralPath $installer)) { throw 'Beta release notes and the verified installer are required.' }
          git merge-base --is-ancestor HEAD origin/main
          if ($LASTEXITCODE -ne 0) { throw 'Beta release source must be on main.' }
          gh release view $tag --repo $env:GITHUB_REPOSITORY --json isDraft
          if ($LASTEXITCODE -eq 0) { throw 'Release already exists. Use a new version; never replace release assets.' }
          $expected = ((Get-Content -LiteralPath "$installer.sha256" -Raw).Trim() -split '\s+')[0]
          if ((Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant() -cne $expected) { throw 'Installer checksum does not match the verified artifact.' }
          gh release create $tag $installer "$installer.sha256" "$installer.signing.json" --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --draft --prerelease --title "VoicePrompt $version Preview" --notes-file $notes
          if ($LASTEXITCODE -ne 0) { throw 'Draft upload failed. Nothing was published.' }
          python scripts/verify_release_assets.py --tag $tag --installer $installer
          if ($LASTEXITCODE -ne 0) { throw 'Hosted beta verification failed; the release remains a draft.' }
          gh release edit $tag --repo $env:GITHUB_REPOSITORY --draft=false --prerelease --latest=false
          if ($LASTEXITCODE -ne 0) { throw 'Beta publication failed; inspect the draft.' }
