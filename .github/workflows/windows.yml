name: Windows app

on:
  push:
    branches: [main, feat/voiceprompt-desktop-redesign]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regressions:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install tested Python dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Validate Python and metadata
        run: |
          python -m pip check
          python -m compileall -q voiceprompt tests
          python scripts/verify_versions.py
      - name: Engine, storage, transport and recording regressions
        env:
          VOICEPROMPT_TEST_LEGACY_TK: '0'
        run: python -m unittest discover -s tests -v
      - name: Frontend checks
        working-directory: desktop
        run: |
          npm ci
          npm run test
          npm run build
          npm audit --omit=dev --audit-level=high
      - name: Browser interaction and accessibility checks
        working-directory: desktop
        run: |
          npx playwright install chromium
          node scripts/verify-ui.cjs --preview
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: VoicePrompt-ui-checks
          path: |
            .impeccable/review/*.png
            build/ui-checks.json
  native-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
      - name: Install tested Python dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Build Tauri, frozen engine and per-user installer
        shell: pwsh
        run: ./scripts/build_desktop.ps1 -Python python -InnoCompiler 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
      - name: Rust checks
        run: |
          cargo test --manifest-path desktop/src-tauri/Cargo.toml --locked --lib
          cargo clippy --manifest-path desktop/src-tauri/Cargo.toml --locked -- -D warnings
      - name: Verify actual native bridge and floating controls
        shell: pwsh
        run: ./scripts/check_native.ps1 -Python python
      - name: Verify installation and live uninstall
        shell: pwsh
        run: ./scripts/check_installer.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: VoicePrompt-windows-x64
          retention-days: 14
          path: |
            release/*
            dist/VoicePrompt/**
            build/frozen-smoke.json
            build/installer-check.json
            build/native-checks.json
            build/native-*.log
            build/uninstall-*.log
            .impeccable/review/native-*.png
