[package]
name = "voiceprompt-desktop"
version = "0.6.0"
description = "Local voice typing and daily focus tools"
authors = ["VoicePrompt contributors"]
edition = "2021"

[lib]
name = "voiceprompt_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "VoicePrompt"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2" }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "devtools"] }
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Gdi"] }
